# Builds the Docker images and pushes them to the GCP Artifact Registry.
#   backend  -> api, worker and migrate (same image, different command)
#   frontend
# Tags: sha-<short> on every build; latest on main; 1.2.3 / 1.2 on a v1.2.3 tag.
# Secret GCP_SA_KEY_BASE64: the service account JSON in base64 (`base64 -i key.json`),
# with the Artifact Registry Writer role on the repository.
name: images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: us-central1-docker.pkg.dev
  REPOSITORY: us-central1-docker.pkg.dev/atena-cloud/acloud

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Login no Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: _json_key_base64
          password: ${{ secrets.GCP_SA_KEY_BASE64 }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REPOSITORY }}/cloud-manager-${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.image }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
