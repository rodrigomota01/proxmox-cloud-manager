# Builds the Docker images and pushes them to the GCP Artifact Registry.
#   backend  -> api, worker and migrate (same image, different command)
#   frontend
# Tags: sha-<short> on every build; latest on main; 1.2.3 / 1.2 on a v1.2.3 tag.
# Secret GCP_SA_KEY_BASE64: the service account JSON in base64 (`base64 -i key.json`),
# with the Artifact Registry Writer role on the repository.
name: images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: us-central1-docker.pkg.dev
  REPOSITORY: us-central1-docker.pkg.dev/atena-cloud/acloud

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Accepts the base64 with or without line breaks (GNU base64 wraps at 76) and also the
      # raw JSON; checks it is a service account key before trying, and never prints it.
      - name: Login no Artifact Registry
        env:
          KEY: ${{ secrets.GCP_SA_KEY_BASE64 }}
        run: |
          if [ -z "$KEY" ]; then echo "::error::secret GCP_SA_KEY_BASE64 vazio ou ausente"; exit 1; fi
          if printf '%s' "$KEY" | jq -e . >/dev/null 2>&1; then
            json="$KEY"
          else
            json=$(printf '%s' "$KEY" | tr -d ' \n\r' | base64 -d 2>/dev/null) \
              || { echo "::error::GCP_SA_KEY_BASE64 não é base64 válido nem JSON"; exit 1; }
          fi
          if ! printf '%s' "$json" | jq -e '.type == "service_account" and (.private_key | length > 0)' >/dev/null 2>&1; then
            echo "::error::GCP_SA_KEY_BASE64 não decodifica para o JSON de uma service account (base64 aplicado duas vezes?)"
            exit 1
          fi
          echo "service account: $(printf '%s' "$json" | jq -r .client_email)"
          printf '%s' "$json" | base64 -w0 | docker login -u _json_key_base64 --password-stdin "https://$REGISTRY"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REPOSITORY }}/cloud-manager-${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.image }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
