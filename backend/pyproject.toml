[project]
name = "cloud-manager-backend"
version = "0.0.1"
description = "Cloud Manager API and worker (multi-tenant cloud management over Proxmox VE)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.142,<1.0",
  "uvicorn[standard]>=0.54,<1.0",
  "pydantic-settings>=2.15,<3.0",
  "asyncpg>=0.31,<1.0",
  "redis>=8.1,<9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.28",
  "anyio>=4",
  "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
