[project]
name = "cloud-manager-backend"
version = "0.0.1"
description = "Cloud Manager API and worker (multi-tenant cloud management over Proxmox VE)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.142,<1.0",
  "uvicorn[standard]>=0.54,<1.0",
  "pydantic-settings>=2.15,<3.0",
  "asyncpg>=0.31,<1.0",
  "redis>=8.1,<9.0",
  "sqlalchemy[asyncio]>=2.1,<2.2",
  "alembic>=1.20,<2.0",
  "argon2-cffi>=25.1,<26.0",
  "pyjwt[crypto]>=2.15,<3.0",
  "httpx>=0.28,<1.0",
  "aiomysql>=0.3,<1.0",  # IPAM: the legacy awf_ip_pool lives in MySQL
  "pyyaml>=6.0,<7.0",  # kubeconfigs of the legacy kubernetes_clusters table
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "anyio>=4",
  "ruff>=0.13",
  "testcontainers[postgres,redis]>=4.15",
  "respx>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # fixed test passwords
"migrations/versions/**" = ["E501", "S608"]  # autogenerated layout; static policy SQL

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs Docker (Postgres/Redis via testcontainers)",
  "lab: talks to a real Proxmox (CM_LAB_PVE_* env vars); skipped otherwise",
]
