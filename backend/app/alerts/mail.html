<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<!-- Alert e-mail (app/alerts/notify.py fills the placeholders). Styles are inline or in
     this <style>: mail clients do not load external CSS; colors come from the severity. -->
<style>
  body { margin: 0; padding: 24px 12px; background: #f1f5f9; color: #0f172a;
         font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .card { max-width: 560px; width: 100%; background: #ffffff; border: 1px solid #e2e8f0;
          border-radius: 10px; overflow: hidden; }
  .band { padding: 18px 24px; background: $bg; border-bottom: 1px solid $border; }
  .tag { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
         color: $color; }
  .title { margin-top: 4px; font-size: 18px; font-weight: 600; color: $color; }
  .headline { padding: 20px 24px 8px; font-size: 15px; line-height: 1.5; }
  .figures { border: 1px solid $border; border-radius: 8px; background: $bg; }
  .figures td { padding: 14px 16px; }
  .figures td + td { border-left: 1px solid $border; }
  .label { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
           color: #475569; }
  .big { margin-top: 2px; font-size: 28px; font-weight: 700; color: $color; }
  .num { margin-top: 2px; font-size: 20px; font-weight: 600; }
  .details { font-size: 14px; line-height: 1.5; }
  .details td { padding: 6px 0; border-top: 1px solid #f1f5f9; }
  .details .k { width: 120px; color: #64748b; }
  .button { display: inline-block; padding: 10px 18px; background: #0067cf; color: #ffffff;
            font-size: 14px; font-weight: 600; text-decoration: none; border-radius: 6px; }
  .footer { padding: 14px 24px; background: #f8fafc; border-top: 1px solid #e2e8f0;
            font-size: 12px; color: #64748b; }
</style>
</head>
<body>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td align="center">
<table role="presentation" class="card" width="560" cellpadding="0" cellspacing="0" border="0">
  <tr><td class="band" style="background:$bg;border-bottom:1px solid $border">
    <div class="tag" style="color:$color">&#9679; $tag</div>
    <div class="title" style="color:$color">$what &middot; $metric</div>
  </td></tr>
  <tr><td class="headline">$headline</td></tr>
  <tr><td style="padding:8px 24px 20px">
    <table role="presentation" class="figures" width="100%" cellpadding="0" cellspacing="0" border="0"
           style="background:$bg;border:1px solid $border">
      <tr>
        <td width="34%"><div class="label">$value_label</div><div class="big" style="color:$color">$value</div></td>
        <td width="33%" style="border-left:1px solid $border"><div class="label">Limite</div><div class="num">$limit</div></td>
        <td width="33%" style="border-left:1px solid $border"><div class="label">Pico</div><div class="num">$peak</div></td>
      </tr>
    </table>
  </td></tr>
  <tr><td style="padding:0 24px 20px">
    <table role="presentation" class="details" width="100%" cellpadding="0" cellspacing="0" border="0">
$rows
    </table>
  </td></tr>
  <tr><td style="padding:0 24px 24px">
    <a class="button" href="$url" style="color:#ffffff">Ver alertas</a>
  </td></tr>
  <tr><td class="footer">Cloud Manager &middot; mensagem automática, não responda a este e-mail.</td></tr>
</table>
</td></tr></table>
</body>
</html>
